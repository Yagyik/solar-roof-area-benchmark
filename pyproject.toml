[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-roof-area-benchmark"
version = "0.1.0"
description = "Roof and obstacle segmentation benchmarks for usable solar area estimation"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
