run:
  name: roof_unet_v2
  seed: 20260819
  mode: smoke

runtime:
  accelerator: gpu
  python_major_minor: ["3.11", "3.12"]
  minimum_gpu_memory_gb: 14.0

paths:
  drive_root: /content/drive/MyDrive/roof_poc
  dataset_work_root: /content/rid2
  artifact_subdirectory: experiment_artifacts/roof

data:
  background_value: 5
  pixel_size_m: 0.08
  validation_fraction: 0.20
  inner_validation_fraction: 0.20
  area_strata: [0.0, 0.01, 0.05, 0.15, 0.35, 0.65, 1.0]

model:
  base_channels: 32
  normalization: group
  group_count: 8

augmentation:
  brightness: 0.15
  contrast: 0.15
  saturation: 0.10
  noise_standard_deviation: 0.01

training:
  batch_size: 2
  learning_rate: 0.0003
  weight_decay: 0.0001
  dice_weight: 0.50
  maximum_positive_weight: 8.0
  positive_weight: null
  scheduler_factor: 0.50
  scheduler_patience: 2
  minimum_learning_rate: 0.000001
  early_stopping_patience: 7
  workers: 2

inference:
  probability_threshold: 0.50

sensitivity:
  probability_thresholds: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]
  iou_tolerance: 0.01
  selection_policy: minimum_area_error_within_iou_tolerance

artifacts:
  save_validation_probability_maps: true

smoke:
  training_images: 60
  validation_images: 20
  epochs: 4

medium:
  training_images: 500
  validation_images: 100
  epochs: 35

full:
  training_images: null
  validation_images: null
  epochs: 60
